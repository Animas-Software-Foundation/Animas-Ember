name: Build & Release

# How releases work
#   VERSION     plain semver, e.g. 0.0.1. Single source of truth for the version and the git tag (v<VERSION>).
#   RELEASE.md  its first "# " heading is the release title; everything below it is the release notes.
#
# To publish: edit VERSION and RELEASE.md, commit, and push to main. If the tag v<VERSION> does not exist yet,
# this workflow builds every platform, creates the tag, and publishes the GitHub Release.
# Pushing a tag by hand also works (it must equal v<VERSION>).
# Actions > Build & Release > Run workflow builds everything; tick "release" to publish too.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Also publish a release (only if the tag for VERSION does not exist yet)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.0"          # must match config/features in project.godot
  PROJECT_SLUG: animas-ember

jobs:
  # ---------------------------------------------------------------------------
  # Reads VERSION and RELEASE.md and decides what this run should do.
  meta:
    name: Read VERSION and RELEASE.md
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      title: ${{ steps.read.outputs.title }}
      prerelease: ${{ steps.read.outputs.prerelease }}
      release: ${{ steps.read.outputs.release }}
      build: ${{ steps.read.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: read
        env:
          INPUT_RELEASE: ${{ inputs.release }}
        run: |
          VERSION="$(tr -d ' \r\n' < VERSION)"
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error file=VERSION::'$VERSION' is not semver (expected e.g. 1.2.3 or 1.2.3-beta.1)"; exit 1
          fi
          TAG="v$VERSION"
          TITLE="$(grep -m1 '^# ' RELEASE.md | sed 's/^# *//')"
          if [ -z "$TITLE" ]; then
            echo "::error file=RELEASE.md::RELEASE.md needs a first-level heading (# Title) to use as the release title"; exit 1
          fi
          PRERELEASE=false
          if [ "${BASH_REMATCH[1]}" = "0" ] || [ -n "${BASH_REMATCH[4]}" ]; then PRERELEASE=true; fi

          TAG_EXISTS=false
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then TAG_EXISTS=true; fi

          RELEASE=false
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [ "$GITHUB_REF_NAME" != "$TAG" ]; then
              echo "::error::Pushed tag $GITHUB_REF_NAME does not match VERSION ($TAG). Fix VERSION or retag."; exit 1
            fi
            RELEASE=true
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$TAG_EXISTS" = "false" ]; then
            RELEASE=true      # new VERSION landed on main
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_RELEASE" = "true" ]; then
            if [ "$TAG_EXISTS" = "true" ]; then
              echo "::warning::Tag $TAG already exists, so no release will be published. Bump VERSION first."
            else
              RELEASE=true
            fi
          fi
          BUILD=false
          if [ "$RELEASE" = "true" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then BUILD=true; fi

          # Release notes: RELEASE.md without its title line, plus a downloads list.
          mkdir -p notes
          {
            awk 'f{print} /^# /&&!f{f=1}' RELEASE.md
            echo
            echo "## Downloads"
            echo
            echo "Files are named \`${PROJECT_SLUG}-${TAG}-<platform>\`. A \`SHA256SUMS.txt\` is attached for verification."
            echo
            echo "| Platform | Installer (self-extracting) | Portable | Plain archive |"
            echo "|----------|-----------------------------|----------|---------------|"
            echo "| Windows (x86_64, x86_32, arm64) | \`*-setup.exe\` | \`*-portable.zip\` | \`*.zip\` |"
            echo "| Linux (x86_64, x86_32, arm64, arm32) | \`*-setup.run\` | \`*-portable.tar.gz\` | \`*.tar.gz\` |"
            echo "| macOS (universal) | \`*-setup.run\` | \`*-portable.zip\` | \`*.zip\` |"
            echo "| Android (arm64, arm32, x86_64, x86, universal) | | | \`*.apk\` |"
            echo
            echo "**Installer** and **portable** downloads keep your saves and settings in a \`data\` folder next to the game, so nothing is written to AppData or your home folder. The plain archive is just the game."
          } > notes/NOTES.md

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "title=$TITLE"
            echo "prerelease=$PRERELEASE"
            echo "release=$RELEASE"
            echo "build=$BUILD"
          } >> "$GITHUB_OUTPUT"
          echo "### $TITLE" >> "$GITHUB_STEP_SUMMARY"
          echo "tag \`$TAG\` · prerelease: $PRERELEASE · publish: $RELEASE · build: $BUILD" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes/NOTES.md

  # ---------------------------------------------------------------------------
  test:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false
      - name: Import project
        run: godot --headless --import || true
      - name: Run smoke test
        run: godot --headless -s tools/smoke_test.gd
      - name: Build the graphical installer (tested in --silent mode)
        run: cargo build --release --manifest-path installer-gui/Cargo.toml
      - name: Test the Rust installer stubs and launcher
        run: python3 tools/test_installer.py

  # ---------------------------------------------------------------------------
  desktop:
    name: ${{ matrix.preset }}
    needs: [meta, test]
    if: needs.meta.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: "Windows x86_64", file: "AnimasEmber-windows-x86_64.exe", pack: zip, asset: windows-x86_64 }
          - { preset: "Windows x86_32", file: "AnimasEmber-windows-x86_32.exe", pack: zip, asset: windows-x86_32 }
          - { preset: "Windows arm64",  file: "AnimasEmber-windows-arm64.exe",  pack: zip, asset: windows-arm64 }
          - { preset: "Linux x86_64", file: "AnimasEmber-linux-x86_64.x86_64", pack: tar, asset: linux-x86_64 }
          - { preset: "Linux x86_32", file: "AnimasEmber-linux-x86_32.x86_32", pack: tar, asset: linux-x86_32 }
          - { preset: "Linux arm64",  file: "AnimasEmber-linux-arm64.arm64",   pack: tar, asset: linux-arm64 }
          - { preset: "Linux arm32",  file: "AnimasEmber-linux-arm32.arm32",   pack: tar, asset: linux-arm32 }
          - { preset: "macOS", file: "AnimasEmber-macos-universal.zip", pack: copy, asset: macos-universal }
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true
      - name: Stamp version ${{ needs.meta.outputs.version }}
        run: python3 tools/sync_version.py
      - name: Export
        run: |
          mkdir -p build dist
          godot --headless --import || true
          godot --headless --export-release "${{ matrix.preset }}" "build/${{ matrix.file }}"
          test -s "build/${{ matrix.file }}"
      - name: Package
        run: |
          NAME="${PROJECT_SLUG}-${{ needs.meta.outputs.tag }}-${{ matrix.asset }}"
          cd build
          case "${{ matrix.pack }}" in
            zip)  zip -9 "../dist/${NAME}.zip" "${{ matrix.file }}" ;;
            tar)  chmod +x "${{ matrix.file }}"; tar -czf "../dist/${NAME}.tar.gz" "${{ matrix.file }}" ;;
            copy) cp "${{ matrix.file }}" "../dist/${NAME}.zip" ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
      - name: Keep the raw export for the portable/installer job
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ matrix.asset }}
          path: build/${{ matrix.file }}
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Portable archive + self-extracting installer for Linux and macOS. The Rust launcher and the console
  # installer stub (installer/) are cross-compiled with cargo-zigbuild. Windows has its own job below,
  # because its installer is graphical. If either job fails, the plain builds above are still released.
  portable:
    name: Portable + setup (${{ matrix.asset }})
    needs: [meta, desktop]
    if: needs.meta.outputs.build == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { asset: linux-x86_64, file: AnimasEmber-linux-x86_64.x86_64, platform: linux, rust: x86_64-unknown-linux-musl,        targets: x86_64-unknown-linux-musl,        exe: "" }
          - { asset: linux-x86_32, file: AnimasEmber-linux-x86_32.x86_32, platform: linux, rust: i686-unknown-linux-musl,          targets: i686-unknown-linux-musl,          exe: "" }
          - { asset: linux-arm64,  file: AnimasEmber-linux-arm64.arm64,   platform: linux, rust: aarch64-unknown-linux-musl,      targets: aarch64-unknown-linux-musl,      exe: "" }
          - { asset: linux-arm32,  file: AnimasEmber-linux-arm32.arm32,   platform: linux, rust: armv7-unknown-linux-musleabihf,  targets: armv7-unknown-linux-musleabihf,  exe: "" }
          - { asset: macos-universal, file: AnimasEmber-macos-universal.zip, platform: macos, rust: universal2-apple-darwin, targets: "x86_64-apple-darwin aarch64-apple-darwin", exe: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: raw-${{ matrix.asset }}
          path: raw
      - name: Stamp version ${{ needs.meta.outputs.version }}
        run: python3 tools/sync_version.py
      - name: Install Rust targets and zig
        run: |
          rustup target add ${{ matrix.targets }}
          pip install ziglang cargo-zigbuild
      - name: Build the launcher and installer stub
        run: cargo zigbuild --release --locked --manifest-path installer/Cargo.toml --target ${{ matrix.rust }}
      - name: Package
        run: |
          BIN="installer/target/${{ matrix.rust }}/release"
          python3 tools/package_portable.py \
            --platform ${{ matrix.platform }} \
            --game "raw/${{ matrix.file }}" \
            --launcher "$BIN/animas-launch${{ matrix.exe }}" \
            --stub "$BIN/animas-sfx${{ matrix.exe }}" \
            --out-dir dist \
            --name "${PROJECT_SLUG}-${{ needs.meta.outputs.tag }}-${{ matrix.asset }}" \
            --version "${{ needs.meta.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-portable-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows: the graphical setup.exe (installer-gui/, egui) and the portable launcher, built natively
  # with MSVC. The setup.exe is the GUI stub with the game appended (see tools/package_portable.py).
  portable-windows:
    name: Setup + portable (${{ matrix.asset }})
    needs: [meta, desktop]
    if: needs.meta.outputs.build == 'true'
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { asset: windows-x86_64, file: AnimasEmber-windows-x86_64.exe, rust: x86_64-pc-windows-msvc }
          - { asset: windows-x86_32, file: AnimasEmber-windows-x86_32.exe, rust: i686-pc-windows-msvc }
          - { asset: windows-arm64,  file: AnimasEmber-windows-arm64.exe,  rust: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: raw-${{ matrix.asset }}
          path: raw
      - name: Stamp version ${{ needs.meta.outputs.version }}
        run: python tools/sync_version.py
      - name: Add the Rust target
        run: rustup target add ${{ matrix.rust }}
      - name: Build the launcher
        run: cargo build --release --locked --manifest-path installer/Cargo.toml --bin animas-launch --target ${{ matrix.rust }}
      - name: Build the graphical installer
        run: cargo build --release --locked --manifest-path installer-gui/Cargo.toml --target ${{ matrix.rust }}
      - name: Package
        run: |
          python tools/package_portable.py \
            --platform windows \
            --game "raw/${{ matrix.file }}" \
            --launcher "installer/target/${{ matrix.rust }}/release/animas-launch.exe" \
            --stub "installer-gui/target/${{ matrix.rust }}/release/animas-setup.exe" \
            --out-dir dist \
            --name "${PROJECT_SLUG}-${{ needs.meta.outputs.tag }}-${{ matrix.asset }}" \
            --version "${{ needs.meta.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-portable-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  android:
    name: Android ${{ matrix.asset }}
    needs: [meta, test]
    if: needs.meta.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: "Android arm64",     file: "AnimasEmber-android-arm64.apk",     asset: android-arm64 }
          - { preset: "Android arm32",     file: "AnimasEmber-android-arm32.apk",     asset: android-arm32 }
          - { preset: "Android x86_64",    file: "AnimasEmber-android-x86_64.apk",    asset: android-x86_64 }
          - { preset: "Android x86",       file: "AnimasEmber-android-x86.apk",       asset: android-x86 }
          - { preset: "Android universal", file: "AnimasEmber-android-universal.apk", asset: android-universal }
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;34.0.0 platforms;android-34 cmdline-tools;latest cmake;3.10.2.4988404 ndk;23.2.8568313"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true
      - name: Stamp version ${{ needs.meta.outputs.version }}
        run: python3 tools/sync_version.py
      - name: Point Godot at the Android SDK and JDK
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          SETTINGS
      - name: Prepare signing keystore
        run: |
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            KUSER="$KEY_ALIAS"; KPASS="$KEY_PASSWORD"
            echo "Using the release keystore from repository secrets."
          else
            # No secrets: sign with a throwaway key so the APK still installs. Updates will NOT install over
            # builds signed with a different key; add the ANDROID_* secrets for stable releases.
            KUSER="animas"; KPASS="android-ci"
            keytool -genkeypair -v -keystore "$KS" -alias "$KUSER" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KPASS" -keypass "$KPASS" -dname "CN=Animas Ember CI, O=Pixel Pulse Games"
          fi
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$KS"       >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KUSER"    >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KPASS" >> "$GITHUB_ENV"
      - name: Export APK
        run: |
          mkdir -p build dist
          godot --headless --import || true
          godot --headless --export-release "${{ matrix.preset }}" "build/${{ matrix.file }}"
          test -s "build/${{ matrix.file }}"
          cp "build/${{ matrix.file }}" "dist/${PROJECT_SLUG}-${{ needs.meta.outputs.tag }}-${{ matrix.asset }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # iOS is opt-in: set repository variables BUILD_IOS=true and APPLE_TEAM_ID=<your team id>
  # (Settings > Secrets and variables > Actions > Variables). Exports an Xcode project, because an
  # installable .ipa needs your Apple Developer certificate and provisioning profile.
  ios:
    name: iOS (Xcode project)
    needs: [meta, test]
    if: ${{ needs.meta.outputs.build == 'true' && vars.BUILD_IOS == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true
      - name: Stamp version ${{ needs.meta.outputs.version }}
        run: python3 tools/sync_version.py
      - name: Export Xcode project
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          sed -i '' "s/0000000000/${APPLE_TEAM_ID:-0000000000}/" export_presets.cfg
          mkdir -p build/ios dist
          godot --headless --import || true
          godot --headless --export-release "iOS" build/ios/AnimasEmber.xcodeproj
          test -d build/ios/AnimasEmber.xcodeproj
          (cd build && zip -r -9 "../dist/${PROJECT_SLUG}-${{ needs.meta.outputs.tag }}-ios-xcode-project.zip" ios)
      - uses: actions/upload-artifact@v4
        with:
          name: dist-ios
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  release:
    name: Publish ${{ needs.meta.outputs.tag }}
    needs: [meta, desktop, portable, portable-windows, android, ios]
    if: ${{ needs.meta.outputs.release == 'true' && !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: notes
      - name: Checksums
        run: cd release && sha256sum * > SHA256SUMS.txt && ls -la
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.meta.outputs.title }}
          body_path: notes/NOTES.md
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          files: release/*
